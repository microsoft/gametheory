name: Studio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-24.04
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          # Ephemeral test-only credential; no application or organizational data.
          MSSQL_SA_PASSWORD: Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Sql!
        ports:
          - 1433:1433
      scheduler:
        image: mcr.microsoft.com/dts/dts-emulator:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install ODBC Driver 18
        run: |
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" -o /tmp/msprod.deb
          sudo dpkg -i /tmp/msprod.deb
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - run: npm ci --no-audit --no-fund
      - run: pip install --require-hashes -r backend/requirements-dev.lock && pip install --no-deps -e backend
      - name: Create disposable test database
        env:
          TEST_SQL_PASSWORD: Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Sql!
        run: python scripts/prepare-test-sql.py
      - name: Backend contracts and real service integrations
        env:
          GT_TEST_SQL_URL: mssql+pyodbc://sa:Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Sql!@127.0.0.1:1433/gametheory_test?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes
          GT_TEST_SCHEDULER_ENDPOINT: http://127.0.0.1:8080
        run: |
          ruff check backend/src backend/tests backend/migrations
          ruff format --check backend/src backend/tests backend/migrations
          mypy --config-file backend/pyproject.toml backend/src
          pytest -q backend/tests
      - name: Generated contract drift
        run: |
          gametheory openapi
          npm run contracts
          git diff --exit-code -- backend/openapi.json apps/web/src/api.generated.ts
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Build application containers
        run: |
          docker build --target api -t gametheory-api:ci .
          docker build --target worker -t gametheory-worker:ci .
          docker build --target validation -t gametheory-validation:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostic-test-artifacts
          path: |
            test-results/
            playwright-report/
