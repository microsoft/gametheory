name: Studio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-24.04
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          # Ephemeral test-only credential; no application or organizational data.
          MSSQL_SA_PASSWORD: Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Sql!
        ports:
          - 1433:1433
      scheduler:
        image: mcr.microsoft.com/dts/dts-emulator:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install ODBC Driver 18
        run: |
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" -o /tmp/msprod.deb
          sudo dpkg -i /tmp/msprod.deb
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - run: npm ci --no-audit --no-fund
      - run: pip install --require-hashes -r backend/requirements-dev.lock && pip install --no-deps -e backend
      - name: Create disposable test database
        env:
          TEST_SQL_PASSWORD: Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Sql!
        run: python scripts/prepare-test-sql.py
      - name: Backend contracts and real service integrations
        env:
          GT_TEST_SQL_URL: mssql+pyodbc://sa:Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Sql!@127.0.0.1:1433/gametheory_test?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes
          GT_TEST_SCHEDULER_ENDPOINT: http://127.0.0.1:8080
        run: |
          ruff check backend/src backend/tests backend/migrations
          ruff format --check backend/src backend/tests backend/migrations
          mypy --config-file backend/pyproject.toml backend/src
          pytest -q backend/tests
      - name: Generated contract drift
        run: |
          gametheory openapi
          gametheory preparation-schemas
          gametheory execution-schemas
          gametheory operation-catalog-schema
          npm run contracts
          git diff --exit-code -- backend/openapi.json backend/contracts backend/operation-catalog.schema.json apps/web/src/api.generated.ts
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Compile Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file validation/infra/main.bicep --stdout > /dev/null
          az bicep build --file validation/infra/registry.bicep --stdout > /dev/null
      - name: Parse acceptance scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Include *.ps1, *.psm1 -Path scripts/acceptance, validation) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $tokens, [ref] $errors) | Out-Null
            foreach ($problem in $errors) {
              Write-Host "::error file=$($file.FullName),line=$($problem.Extent.StartLineNumber)::$($problem.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Build application containers
        run: |
          docker build --target api -t gametheory-api:ci .
          docker build --target worker -t gametheory-worker:ci .
          docker build --target executor -t gametheory-executor:ci .
          docker build --target validation -t gametheory-validation:ci .
          docker run --rm gametheory-api:ci python -c "import pathlib; assert not pathlib.Path('/app/exercises').exists(), 'External exercise code must not be bundled'"
          docker run --rm gametheory-executor:ci python -c "import pathlib; assert not pathlib.Path('/app/exercises').exists(), 'Executor must not bundle external exercise code'"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostic-test-artifacts
          path: |
            test-results/
            playwright-report/
  flood-lab:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: exercises/flood-response
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          # Disposable, job-local test credential; never an exercise runtime identity.
          MSSQL_SA_PASSWORD: Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Lab!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: exercises/flood-response/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: exercises/flood-response/requirements-dev.lock
      - name: Install ODBC Driver 18
        run: |
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" -o /tmp/msprod.deb
          sudo dpkg -i /tmp/msprod.deb && sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - name: Install independent lab dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.lock
          npm --prefix ui ci --no-audit --no-fund
      - name: Create separate disposable lab database
        env:
          TEST_SQL_PASSWORD: Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Lab!
        run: .venv/bin/python ../../scripts/prepare-test-sql.py --database-name flood_lab_test_ci
      - name: Install isolated browser
        working-directory: exercises/flood-response/ui
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/exercises/flood-response/.local/browsers
        run: npx playwright install --with-deps chromium
      - name: Verify contracts, UI and real SQL behavior
        env:
          FLOOD_LAB_TEST_DATABASE_NAME: flood_lab_test_ci
          FLOOD_LAB_TEST_DATABASE_URL: mssql+pyodbc://sa:Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Lab!@127.0.0.1:1433/flood_lab_test_ci?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes
          FLOOD_LAB_TEST_ALLOW_RESET: 'yes'
        run: bash scripts/verify.sh --browser --sql
      - name: Build independent lab images
        run: |
          docker build -f Dockerfile -t flood-lab-api:ci .
          docker build -f Dockerfile.ui -t flood-lab-ui:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: independent-lab-test-artifacts
          path: |
            exercises/flood-response/ui/test-results/
            exercises/flood-response/ui/playwright-report/
  execution:
    runs-on: ubuntu-24.04
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Execution!
        ports:
          - 1433:1433
      scheduler:
        image: mcr.microsoft.com/dts/dts-emulator:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.lock
            exercises/flood-response/requirements-dev.lock
      - name: Install ODBC Driver 18
        run: |
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" -o /tmp/msprod.deb
          sudo dpkg -i /tmp/msprod.deb && sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - name: Install isolated product and lab environments
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --require-hashes -r backend/requirements-dev.lock
          backend/.venv/bin/pip install --no-deps -e backend
          backend/.venv/bin/pip check
          python -m venv exercises/flood-response/.venv
          exercises/flood-response/.venv/bin/pip install --require-hashes -r exercises/flood-response/requirements-dev.lock
      - name: Create separate disposable databases
        env:
          TEST_SQL_PASSWORD: Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Execution!
        run: |
          backend/.venv/bin/python scripts/prepare-test-sql.py --database-name gametheory_test_execution
          backend/.venv/bin/python scripts/prepare-test-sql.py --database-name flood_lab_test_execution
      - name: Real SQL, isolated HTTPS lab, and durable execution restart
        env:
          GT_TEST_SQL_URL: mssql+pyodbc://sa:Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Execution!@127.0.0.1:1433/gametheory_test_execution?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes
          FLOOD_LAB_TEST_DATABASE_NAME: flood_lab_test_execution
          FLOOD_LAB_TEST_DATABASE_URL: mssql+pyodbc://sa:Ephemeral-${{ github.run_id }}-${{ github.run_attempt }}-Execution!@127.0.0.1:1433/flood_lab_test_execution?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes
          FLOOD_LAB_TEST_ALLOW_RESET: 'yes'
          GT_TEST_EXECUTION_LAB: 'true'
          GT_TEST_EXECUTION_SCHEDULER_ENDPOINT: http://127.0.0.1:8080
        run: |
          backend/.venv/bin/pytest -q --basetemp=.test-execution \
            backend/tests/test_environment_policy.py backend/tests/test_execution.py \
            backend/tests/test_execution_sql.py backend/tests/test_execution_lab.py \
            backend/tests/test_execution_scheduler.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: execution-diagnostic-logs
          path: |
            .test-execution/**/lab-fixture.log
            .test-execution/**/execution-worker.log
